name: Refresh IPO Dashboard

on:

  workflow_dispatch:

  schedule:
    - cron: "55 19 * * 1-5"

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Build data
        run: |
          python build_ipo_dashboard_data.py

      - name: Commit updates
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add data/*

          git commit -m "refresh dashboard data" || echo "No changes"

          git push

  deploy:

    needs: build

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:

      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
